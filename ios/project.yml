name: ShelfnStir
options:
  bundleIdPrefix: com.decentkiwi
  deploymentTarget:
    iOS: "17.0"
targets:
  ShelfnStir:
    type: application
    platform: iOS
    sources:
      - path: ShelfnStir
    info:
      path: ShelfnStir/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The app only uses HTTPS via standard iOS networking APIs (no custom
        # crypto in the app binary itself), which is exempt from export
        # compliance documentation. Declaring it upfront skips App Store
        # Connect's encryption question on every single build upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decentkiwi.ShelfnStir
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
